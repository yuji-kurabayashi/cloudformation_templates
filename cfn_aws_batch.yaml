AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Create AWS Batch for ECS(Fargate) resources.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AWS Batch Resources Name Prefix
        Parameters:
          - ResourcePrefix
      - Label:
          default: AWS Batch Resource Settings
        Parameters:
          - AwsBatchVpcId
          - AwsBatchSubnetIds
          - ComputeResourcesType
          - AssignPublicIp
          - CpuArchitecture
          - AwsBatchVCPU
          - AwsBatchMemory
          - BatchExecutionManagedPolicyAllowActions
          - EcrRepositoryName
          - DockerImageTag

    ParameterLabels:

      ResourcePrefix:
        default: prefix

      AwsBatchVpcId:
        default: AwsBatchVpcId
      AwsBatchSubnetIds:
        default: AwsBatchSubnetIds
      ComputeResourcesType:
        default: ComputeResourcesType
      AssignPublicIp:
        default: AssignPublicIp
      CpuArchitecture:
        default: CpuArchitecture
      AwsBatchVCPU:
        default: AwsBatchVCPU
      AwsBatchMemory:
        default: AwsBatchMemory
      BatchExecutionManagedPolicyAllowActions:
        default: AllowActions
      EcrRepositoryName:
        default: EcrRepositoryName
      DockerImageTag:
        default: DockerImageTag

Parameters:

  ResourcePrefix:
    Description: <Required> This value is used as the resource name prefix.
    Type: String
    MinLength: 1

  AwsBatchVpcId:
    Type: AWS::EC2::VPC::Id
    Description: <Required> VPC ID where AWS Batch create.
  AwsBatchSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: <Required> Subnet ID where AWS Batch create. (can be multiple)
  ComputeResourcesType:
    Type: String
    Description: The type of compute environment. Fargate Spot is not supported for ARM64 and Windows-based containers on Fargate. A job queue will be blocked if a Fargate ARM64 or Windows job is submitted to a job queue with only Fargate Spot compute environments. However, you can attach both FARGATE and FARGATE_SPOT compute environments to the same job queue. see https://docs.aws.amazon.com/ja_jp/batch/latest/APIReference/API_RuntimePlatform.html
    Default: FARGATE
    AllowedValues:
      - FARGATE_SPOT
      - FARGATE
  AssignPublicIp:
    Type: String
    Description: Assign Public IP to AWS Batch job or not. If the subnet is private, AssignPublicIp is supposed to be 'DISABLED'
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
  CpuArchitecture:
    Type: String
    Description: The vCPU architecture.
    Default: ARM64
    AllowedValues:
      - X86_64
      - ARM64
  AwsBatchVCPU:
    Type: Number
    Description: Number of AWS Batch VCPU for ComputeEnvironment. see https://docs.aws.amazon.com/ja_jp/AWSCloudFormation/latest/UserGuide/aws-properties-batch-jobdefinition-resourcerequirement.html
    Default: 2
    AllowedValues: [ 0.25, 0.5, 1, 2, 4, 8, 16 ]
  AwsBatchMemory:
    Type: Number
    Description: Number of AWS Batch Memory(unit:MB) for ComputeEnvironment. Allowed values are depends on VCPU value. see https://docs.aws.amazon.com/ja_jp/AWSCloudFormation/latest/UserGuide/aws-properties-batch-jobdefinition-resourcerequirement.html
    Default: 4096
  BatchExecutionManagedPolicyAllowActions:
    Type: CommaDelimitedList
    Description: <Optional> A list of Managed Policy Allow Actions to be applied to the creation of role. You can specify multiple targets separated with comma(,).
  EcrRepositoryName:
    Type: String
    Description: <Required> ECR repository Name for AWS Batch uses.
    MinLength: 1
  DockerImageTag:
    Type: String
    Description: <Required> Docker image tag for AWS Batch uses.
    MinLength: 1
    Default: latest

Conditions:

  SpecifiedBatchExecutionManagedPolicyAllowActions:
    Fn::Not:
      - !Equals [ !Join [ ',', !Ref BatchExecutionManagedPolicyAllowActions ], "" ]

Resources:

  AwsBatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${ResourcePrefix}-batch-sg
      GroupDescription: !Sub ${ResourcePrefix} Security Group for AWS Batch.
      VpcId: !Ref AwsBatchVpcId
      Tags:
        - Key: Name
          Value: !Sub ${ResourcePrefix}-batch-sg

  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-batch-service-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - batch.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
      Tags:
        - Key: Name
          Value: !Sub ${ResourcePrefix}-batch-service-role

  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub ${ResourcePrefix}-batch-compute-environment
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: !Ref ComputeResourcesType
        MaxvCpus: 16
        Subnets: !Ref AwsBatchSubnetIds
        SecurityGroupIds:
          - !Ref AwsBatchSecurityGroup
      ServiceRole: !Ref BatchServiceRole
      Tags:
        Name: !Sub ${ResourcePrefix}-batch-compute-environment

  BatchExecutionDefaultManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-batch-execution-default-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: SecretReadAccessAllowActions
            Effect: Allow
            Action:
              - ssm:GetParameters
              - secretsmanager:GetSecretValue
            Resource: "*"
          -
            Sid: EcrGetAuthorizationTokenAllowActions
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: "*"
          -
            Sid: EcrPullImageAllowActions
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
            Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}

  BatchExecutionManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: SpecifiedBatchExecutionManagedPolicyAllowActions
    Properties:
      ManagedPolicyName: !Sub ${ResourcePrefix}-batch-execution-managed-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          -
            Sid: BatchExecutionManagedPolicyAllowActions
            Effect: Allow
            Action: !Ref BatchExecutionManagedPolicyAllowActions
            Resource: "*"

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourcePrefix}-batch-execution-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole
        - !Ref BatchExecutionDefaultManagedPolicy
        - Fn::If:
            - SpecifiedBatchExecutionManagedPolicyAllowActions
            - !Ref BatchExecutionManagedPolicy
            - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub ${ResourcePrefix}-batch-execution-role

  BatchExecutionRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ResourcePrefix}-batch-execution-role-policy
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: !Ref BatchComputeEnvironment
      Roles:
        - !Ref BatchExecutionRole
        - !Ref BatchServiceRole

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PropagateTags: true
      JobDefinitionName: !Sub ${ResourcePrefix}-job-definition
      PlatformCapabilities:
        - FARGATE
      RetryStrategy:
        Attempts: 1
      ContainerProperties:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.${AWS::URLSuffix}/${EcrRepositoryName}:${DockerImageTag}
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        ResourceRequirements:
          - Type: VCPU
            Value: !Ref AwsBatchVCPU
          - Type: MEMORY
            Value: !Ref AwsBatchMemory
        JobRoleArn: !GetAtt BatchExecutionRole.Arn
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref AwsBatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: !Ref ResourcePrefix
        NetworkConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
        RuntimePlatform:
          CpuArchitecture: !Ref CpuArchitecture
          OperatingSystemFamily: LINUX
      Tags:
        Name: !Sub ${ResourcePrefix}-job-definition

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub ${ResourcePrefix}-job-queue
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      Tags:
        Name: !Sub ${ResourcePrefix}-job-queue

  AwsBatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/batch/${ResourcePrefix}
      Tags:
        - Key: Name
          Value: !Sub /aws/batch/${ResourcePrefix}
